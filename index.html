<!DOCTYPE html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>Light + Face Detection</title><script src=https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js></script><style>*{box-sizing:border-box;margin:0;padding:0}body{color:#e2e8f0;background:#0f1117;flex-direction:column;align-items:center;min-height:100vh;padding:20px 12px;font-family:system-ui,-apple-system,sans-serif;display:flex}h1{color:#94a3b8;margin-bottom:12px;font-size:1.25rem;font-weight:600}#status{text-align:center;color:#cbd5e1;background:#1e293b;border-radius:6px;min-width:280px;margin-bottom:12px;padding:7px 14px;font-size:.82rem;transition:background .2s}#status.error{color:#fca5a5;background:#7f1d1d}#status.success{color:#86efac;background:#14532d}.preview-area{margin-bottom:14px;position:relative}#canvas,#overlayCanvas{background:#1a1a2e;border:1px solid #334155;border-radius:8px}#overlayCanvas{pointer-events:none;background:0 0;border:none;position:absolute;top:0;left:0}video{width:0;height:0;display:none}#results{width:100%;max-width:380px;font-size:.8rem}.bar-row{align-items:center;gap:8px;margin-bottom:5px;display:flex}.bar-label{text-align:right;color:#94a3b8;flex-shrink:0;width:80px;font-size:.76rem;font-weight:500}.bar-track{background:#1e293b;border-radius:4px;flex:1;height:13px;overflow:hidden}.bar-fill{border-radius:4px;height:100%;transition:width .12s}.bar-pct{text-align:right;color:#64748b;flex-shrink:0;width:44px;font-size:.73rem}#timing{color:#475569;text-align:center;margin-top:8px;font-size:.73rem}#faceInfo{color:#94a3b8;text-align:center;margin-top:6px;font-size:.73rem}</style><body>

  <div id=faceInfo></div>
